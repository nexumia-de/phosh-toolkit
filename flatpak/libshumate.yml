# libshumate (map widget) with protobuf-c, which it needs for vector
# tiles; neither is in org.gnome.Platform. Shared by the apps with a map
# (docs/toolkit-usage.md, "Shared Flatpak modules"): an app's manifest
# lists this file as a module, through the toolkit as a git submodule.
#
# Licence texts go to /app/share/licenses/<app id>/<module>/, which the
# Flatpak workflow checks; list `libshumate` (LGPL-2.1-or-later) and
# `protobuf-c` (BSD-2-Clause) in the app's docs/dependencies.md.
# Versions are kept current here by .github/workflows/update-check.yml
# of phosh-toolkit, not in the apps.
name: libshumate
buildsystem: meson
config-opts:
  - --libdir=lib
  - -Dgtk_doc=false
  - -Dvapi=false
  - -Ddemos=false
  - -Dsysprof=disabled
post-install:
  # meson builds in _flatpak_build/, the licence is in the source root.
  - install -Dm644 ../COPYING -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/libshumate
sources:
  - type: archive
    url: https://download.gnome.org/sources/libshumate/1.7/libshumate-1.7.1.tar.xz
    sha256: 5316878f7d6a2124d8d53bdd3a34b3656f1c2337b2082aa59ed667969c0bd8f4
    x-checker-data:
      type: gnome
      name: libshumate
      stable-only: true
modules:
  - name: protobuf-c
    buildsystem: autotools
    config-opts:
      - --disable-protoc
    post-install:
      - install -Dm644 LICENSE -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/protobuf-c
    sources:
      - type: archive
        url: https://github.com/protobuf-c/protobuf-c/releases/download/v1.5.2/protobuf-c-1.5.2.tar.gz
        sha256: e2c86271873a79c92b58fef7ebf8de1aa0df4738347a8bd5d4e65a80a16d0d24
        x-checker-data:
          type: json
          url: https://api.github.com/repos/protobuf-c/protobuf-c/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "protobuf-c-" + $version + ".tar.gz") | .browser_download_url

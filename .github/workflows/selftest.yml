# Exercises the toolkit itself: validators, the release and screenshot
# scripts and the reusable Flatpak workflow with the demo app in examples/.
name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up host
        run: ./setup.sh
        env:
          SETUP_PROFILE: ci
      - name: Validate desktop file and metainfo
        run: |
          desktop-file-validate examples/*.desktop
          appstreamcli validate --no-net examples/*.metainfo.xml
          # Phosh needs "mobile;" (case-insensitive, trailing ';').
          grep -Eiq '^X-Purism-FormFactor=.*mobile;' examples/*.desktop
      - name: Lint shell scripts
        run: shellcheck setup.sh scripts/*.sh
      - name: Test the release script
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 \
            install -y -q --no-install-recommends python3-pytest
          python3 -m pytest -v tests
          python3 scripts/release.py --root examples check
      - name: Screenshot demo at 360x720
        run: |
          npm install --prefix scripts --no-audit --no-fund
          (cd scripts && npx playwright install --with-deps chromium)
          export NODE_PATH=$PWD/scripts/node_modules
          scripts/screenshot.sh -o demo-360x720.png -- python3 examples/adw-demo.py
          scripts/screenshot.sh -c dark -o demo-360x720-dark.png -- python3 examples/adw-demo.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-screenshot
          path: demo-360x720*.png

  flatpak:
    # The reusable workflow's release job declares contents: write; a
    # caller must grant at least that or the run fails at startup. The
    # release job itself is skipped here (release is not set).
    permissions:
      contents: write
    uses: ./.github/workflows/flatpak.yml
    with:
      manifest: examples/de.nexumia.PhoshDemo.yml
      # Takes the demo's screenshots from the built Flatpak, with the
      # scripts of this commit rather than main.
      release-config: examples/release.toml
      toolkit-ref: ${{ github.event.pull_request.head.sha || github.sha }}

# Exercises the toolkit itself: validators, screenshot script and the
# reusable Flatpak workflow with the demo app in examples/.
name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up host
        run: ./setup.sh
        env:
          SETUP_PROFILE: ci
      - name: Validate desktop file and metainfo
        run: |
          desktop-file-validate examples/*.desktop
          appstreamcli validate --no-net examples/*.metainfo.xml
          # Phosh needs "mobile;" (case-insensitive, trailing ';').
          grep -Eiq '^X-Purism-FormFactor=.*mobile;' examples/*.desktop
      - name: Lint shell scripts
        run: shellcheck setup.sh scripts/*.sh
      - name: Screenshot demo at 360x720
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          scripts/screenshot.sh -o demo-360x720.png -- python3 examples/adw-demo.py
      - uses: actions/upload-artifact@v7
        with:
          name: demo-screenshot
          path: demo-360x720.png

  flatpak:
    # The reusable workflow's release job declares contents: write; a
    # caller must grant at least that or the run fails at startup. The
    # release job itself is skipped here (release is not set).
    permissions:
      contents: write
    uses: ./.github/workflows/flatpak.yml
    with:
      manifest: examples/de.nexumia.PhoshDemo.yml

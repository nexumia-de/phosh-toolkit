# Exercises the toolkit itself: validators, the release and screenshot
# scripts, the shared Python package in lib/ and the reusable Flatpak
# workflow with the demo app in examples/.
name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up host
        run: ./setup.sh
        env:
          SETUP_PROFILE: ci
      # .pre-commit-config.yaml: metadata, shellcheck, reuse lint; the
      # same hooks a commit runs locally.
      - name: Run the pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Test the release script
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 \
            install -y -q --no-install-recommends python3-pytest
          python3 -m pytest -v tests --ignore=tests/lib
          python3 scripts/release.py --root examples check
      - name: Screenshot demo at 360x720
        run: |
          npm install --prefix scripts --no-audit --no-fund
          (cd scripts && npx playwright install --with-deps chromium)
          export NODE_PATH=$PWD/scripts/node_modules
          scripts/screenshot.sh -o demo-360x720.png -- python3 examples/adw-demo.py
          scripts/screenshot.sh -c dark -o demo-360x720-dark.png -- python3 examples/adw-demo.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-screenshot
          path: demo-360x720*.png

  lib:
    # The shared package (docs/shared-connection.md) with real widgets
    # (xvfb), GStreamer and mutual TLS against certificates made by openssl.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120)
          "${apt[@]}" update -q
          "${apt[@]}" install -y -q --no-install-recommends \
            python3-pytest python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-soup-3.0 gir1.2-secret-1 glib-networking \
            gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gir1.2-webkit-6.0 bubblewrap \
            gir1.2-xdp-1.0 gir1.2-xdpgtk4-1.0 openssl xvfb xauth dbus
      - name: Run tests
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 -m pytest -v tests/lib

  flatpak:
    # The reusable workflow's release job declares contents: write; a
    # caller must grant at least that or the run fails at startup. The
    # release job itself is skipped here (release is not set).
    permissions:
      contents: write
    uses: ./.github/workflows/flatpak.yml
    with:
      manifest: examples/de.nexumia.PhoshDemo.yml
      metadata: examples/*
      # Takes the demo's screenshots from the built Flatpak. The scripts
      # come from this commit: the workflow checks the toolkit out at
      # the commit of its own file.
      release-config: examples/release.toml

  # A change to the reusable Flatpak workflow or to the scripts it runs
  # also builds a real app with it before it is tagged: apps pin the
  # workflows to a toolkit tag (docs/decisions/toolkit-version-pins.md).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workflow: ${{ steps.diff.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did the Flatpak workflow or its scripts change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=false
          case $EVENT in
            workflow_dispatch) changed=true ;;
            pull_request)
              if ! git diff --quiet "$BASE" HEAD -- .github/workflows/flatpak.yml scripts; then
                changed=true
              fi ;;
          esac
          echo "workflow=$changed" >> "$GITHUB_OUTPUT"

  app:
    # Pulsus: a small real app (the phosh-toolkit module and the app)
    # with release screenshots.
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/flatpak.yml
    with:
      app-repository: nexumia-de/pulsus
      manifest: de.nexumia.Pulsus.yml

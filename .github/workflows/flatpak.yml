# Reusable workflow: build Flatpak bundles for x86_64 and aarch64 and
# publish the stable and the nightly channel.
#
# Usage from an app repository (docs/flatpak-workflow.md):
#
#   on:
#     push:
#       branches: [main]
#       tags: ['v*']
#     pull_request:
#     workflow_dispatch:
#   jobs:
#     flatpak:
#       permissions:
#         contents: write
#       uses: suitably/phosh-toolkit/.github/workflows/flatpak.yml@main
#       with:
#         manifest: de.nexumia.MyApp.yml
#         release: true
#         nightly: true
#
# Each architecture builds natively (aarch64 on ubuntu-24.04-arm) and uploads
# the app bundle "<bundle>-<arch>.flatpak" and the matching source bundle
# "<bundle>-sources-<arch>.flatpak" (runtime <app id>.Sources, every source
# the build used) as the artifact "<bundle>-<arch>".
#
# Licence checks (docs/licensing.md in phosh-toolkit): the reuse job runs
# "reuse lint"; every module except the app itself must be listed in
# dependencies-doc and install its licence texts into
# /app/share/licenses/<app id>/<module name>/.
#
# Channels (docs/flatpak-workflow.md, "Release channels"):
# - Stable, with "release: true": a pushed tag v<version> attaches the
#   bundles to the GitHub Release of that tag.
# - Nightly, with "nightly: true": every push to the default branch
#   also builds the app id <app id>.Devel with -Dprofile=development and
#   -Dbuild_label="<branch> · <commit>" and attaches it to the
#   pre-release "nightly".
# The calling job must grant "contents: write" (a caller must grant what
# the jobs below declare, even for jobs that are skipped).
name: Flatpak

on:
  workflow_call:
    inputs:
      manifest:
        description: Path to the Flatpak manifest, relative to the repository root.
        required: true
        type: string
      bundle:
        description: Bundle file name without extension. Defaults to the app id.
        required: false
        type: string
        default: ''
      retention-days:
        description: Artifact retention in days.
        required: false
        type: number
        default: 14
      release:
        description: On a pushed tag v<version>, attach the bundles to its GitHub Release.
        required: false
        type: boolean
        default: false
      nightly:
        description: On a push to the default branch, also build the nightly app <app id>.Devel and attach it to the release "nightly".
        required: false
        type: boolean
        default: false
      dependencies-doc:
        description: File that lists every bundled module with version and licence.
        required: false
        type: string
        default: docs/dependencies.md
      publish-repo:
        description: Repository to notify after a release (repository_dispatch "app-updated").
        required: false
        type: string
        default: ''
    secrets:
      PUBLISH_TOKEN:
        description: Token allowed to dispatch to publish-repo. Without it the publish repo's schedule picks the release up.
        required: false

permissions:
  contents: read

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  build:
    # Stable keeps the plain name, which branch rulesets require.
    name: ${{ matrix.variant == 'nightly' && format('Build nightly ({0})', matrix.arch) || format('Build ({0})', matrix.arch) }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        # Nightly only for pushes to the default branch.
        variant: ${{ fromJSON(inputs.nightly && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && '["stable", "nightly"]' || '["stable"]') }}
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Flatpak tooling
        run: |
          apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120)
          "${apt[@]}" update -q
          # librsvg2-common provides the SVG pixbuf loader; without it
          # "appstreamcli compose" cannot read SVG icons (file-read-error).
          # elfutils provides eu-strip, which flatpak-builder runs on every
          # ELF file it installs; both are only Recommends.
          "${apt[@]}" install -y -q --no-install-recommends \
            flatpak flatpak-builder librsvg2-common elfutils
          # Ubuntu 24.04 restricts unprivileged user namespaces, which
          # bubblewrap needs for the build sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Prepare manifest
        id: manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
          VARIANT: ${{ matrix.variant }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ $VARIANT != nightly ]]; then
            echo "path=$MANIFEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nightly: app id <app id>.Devel; the app module (the last one)
          # gets -Dprofile=development and -Dbuild_label. Written next to
          # the manifest so relative source paths still resolve.
          out=$(dirname "$MANIFEST")/nightly-manifest.json
          flatpak-builder --show-manifest "$MANIFEST" | python3 -c '
          import json, sys
          m = json.load(sys.stdin)
          key = "id" if "id" in m else "app-id"
          m[key] += ".Devel"
          m["modules"][-1].setdefault("config-opts", []).extend(
              ["-Dprofile=development", "-Dbuild_label=" + sys.argv[1]])
          json.dump(m, sys.stdout, indent=2, ensure_ascii=False)' "$BRANCH · ${GITHUB_SHA::7}" > "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Read app id
        id: meta
        env:
          MANIFEST: ${{ steps.manifest.outputs.path }}
          BUNDLE: ${{ inputs.bundle }}
          VARIANT: ${{ matrix.variant }}
        run: |
          app_id=$(flatpak-builder --show-manifest "$MANIFEST" \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(m.get("id") or m["app-id"])')
          bundle=${BUNDLE:-$app_id}
          if [[ -n $BUNDLE && $VARIANT == nightly ]]; then bundle+=.Devel; fi
          # Third-party modules: all modules except the last top-level one,
          # which is the app itself (its nested modules count as well).
          {
            echo "app-id=$app_id"
            echo "bundle=$bundle"
            echo 'modules<<EOF'
            flatpak-builder --show-manifest "$MANIFEST" | python3 -c '
          import json, sys
          def walk(mods):
              for m in mods:
                  if isinstance(m, dict):
                      yield from walk(m.get("modules", []))
                      yield m["name"]
          top = json.load(sys.stdin)["modules"]
          print("\n".join([*walk(top[:-1]), *walk(top[-1].get("modules", []))]))'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Check dependency inventory
        env:
          MODULES: ${{ steps.meta.outputs.modules }}
          DOC: ${{ inputs.dependencies-doc }}
        run: |
          [ -n "$MODULES" ] || exit 0
          [ -f "$DOC" ] || { echo "::error::$DOC is missing; list every bundled module there."; exit 1; }
          missing=0
          while read -r name; do
            grep -qF "\`$name\`" "$DOC" ||
              { echo "::error file=$DOC::Module $name is not listed in $DOC."; missing=1; }
          done <<<"$MODULES"
          exit $missing

      - name: Cache flatpak-builder state
        uses: actions/cache@v6
        with:
          path: .flatpak-builder
          # One entry per arch, variant and manifest version (no per-run
          # entries); both variants share the third-party modules.
          key: flatpak-builder-${{ matrix.arch }}-${{ matrix.variant }}-${{ hashFiles(inputs.manifest) }}
          restore-keys: |
            flatpak-builder-${{ matrix.arch }}-${{ matrix.variant }}-
            flatpak-builder-${{ matrix.arch }}-

      - name: Build
        env:
          MANIFEST: ${{ steps.manifest.outputs.path }}
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --ccache --force-clean --arch=${{ matrix.arch }} \
            --bundle-sources --repo=repo build-dir "$MANIFEST"

      - name: Check licence files
        env:
          APP_ID: ${{ steps.meta.outputs.app-id }}
          MODULES: ${{ steps.meta.outputs.modules }}
        run: |
          [ -n "$MODULES" ] || exit 0
          missing=0
          while read -r name; do
            dir=build-dir/files/share/licenses/$APP_ID/$name
            files=$(find "$dir" -mindepth 1 -printf '%P ' 2>/dev/null || true)
            if [ -n "$files" ]; then
              echo "$name: $files"
            else
              echo "::error::Module $name installs no licence files into /app/share/licenses/$APP_ID/$name."
              missing=1
            fi
          done <<<"$MODULES"
          exit $missing

      - name: Check release version
        if: matrix.variant == 'stable' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          APP_ID: ${{ steps.meta.outputs.app-id }}
        run: |
          version=$(python3 -c '
          import sys, xml.etree.ElementTree as ET
          print(ET.parse(sys.argv[1]).find("releases/release").get("version"))' \
            "build-dir/files/share/metainfo/$APP_ID.metainfo.xml")
          if [[ v$version != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the newest metainfo release $version."
            exit 1
          fi

      - name: Bundle
        env:
          APP_ID: ${{ steps.meta.outputs.app-id }}
          BUNDLE: ${{ steps.meta.outputs.bundle }}
        run: |
          flatpak build-bundle --arch=${{ matrix.arch }} \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "$BUNDLE-${{ matrix.arch }}.flatpak" "$APP_ID"
          # Corresponding source for the (L)GPL parts, published next to
          # the app.
          flatpak build-bundle --arch=${{ matrix.arch }} --runtime \
            repo "$BUNDLE-sources-${{ matrix.arch }}.flatpak" "$APP_ID.Sources"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.bundle }}-${{ matrix.arch }}
          path: |
            ${{ steps.meta.outputs.bundle }}-${{ matrix.arch }}.flatpak
            ${{ steps.meta.outputs.bundle }}-sources-${{ matrix.arch }}.flatpak
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  release:
    name: Release bundles
    needs: build
    if: inputs.release && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Tag runs build only the stable variant.
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          merge-multiple: true

      - name: Attach bundles to the release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(bundles/*.flatpak)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            # A tag with a suffix (v1.0.0-rc.1) becomes a pre-release,
            # which phosh-apps does not publish.
            pre=()
            if [[ $TAG == *-* ]]; then pre=(--prerelease); fi
            gh release create "$TAG" "${files[@]}" --verify-tag \
              --title "$TAG" --generate-notes "${pre[@]}"
          fi

  nightly:
    name: Publish nightly
    needs: build
    if: >-
      inputs.nightly && github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Uploads never overlap; an older push that finishes later is skipped
    # by the check below. No cancel-in-progress: a stale run arriving
    # later would cancel the upload of the current one.
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          pattern: '*.Devel-*'
          merge-multiple: true

      - name: Attach bundles to the release "nightly"
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          head=$(gh api "repos/$GH_REPO/commits/$BRANCH" --jq .sha)
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::$BRANCH moved on to ${head::7}; its own run publishes it."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes="Nightly build of $BRANCH · ${GITHUB_SHA::7} ($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA). Replaced by every push to $BRANCH."
          files=(bundles/*.flatpak)
          if gh release view nightly >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload nightly "${files[@]}" --clobber
            # Drop bundles this build no longer produces (e.g. after an
            # app id rename), so phosh-apps does not publish them.
            keep=$(printf '%s\n' "${files[@]##*/}")
            gh release view nightly --json assets -q '.assets[].name' |
              grep -vxF "$keep" | while read -r old; do
                gh release delete-asset nightly "$old" --yes
              done
            gh release edit nightly --notes "$notes"
          else
            gh release create nightly "${files[@]}" --target "$GITHUB_SHA" \
              --prerelease --title "Nightly" --notes "$notes"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

  notify:
    name: Notify the publish repository
    needs: [release, nightly]
    if: >-
      always() && inputs.publish-repo != '' &&
      (needs.release.result == 'success' || needs.nightly.outputs.published == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send repository_dispatch "app-updated"
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_REPO: ${{ inputs.publish-repo }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No PUBLISH_TOKEN; $PUBLISH_REPO picks this release up on its schedule."
            exit 0
          fi
          gh api "repos/$PUBLISH_REPO/dispatches" -f event_type=app-updated \
            -f "client_payload[repository]=$GITHUB_REPOSITORY"
